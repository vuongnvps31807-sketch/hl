<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chi tiết sản phẩm | WinMart</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <header class="store-header">
    <div class="store-container header-main">
      <a href="index.html" class="wordmark"><span class="wordmark-w">Win</span>Mart</a>
      <div class="header-actions">
        <a href="cart.html" class="header-action">
          <span class="cart-icon-wrap">🛒<span class="cart-count" data-cart-count>0</span></span>
          <span class="cart-label">Giỏ hàng</span>
        </a>
      </div>
    </div>
  </header>

  <main class="store-container page-main">
    <a href="index.html" class="back-link">← Quay lại trang chủ</a>
    <div id="detail" class="product-detail"></div>
  </main>

  <footer class="store-footer">
    <div class="store-container footer-inner">
      <span class="wordmark footer-wordmark"><span class="wordmark-w">Win</span>Mart</span>
      <p>Mua sắm thực phẩm tươi ngon mỗi ngày</p>
    </div>
  </footer>

  <script src="products.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const product = WM_PRODUCTS.find(p => p.id === params.get("id"));
    const box = document.getElementById("detail");
    let qty = 1;

    document.title = product ? product.name + " | WinMart" : "Không tìm thấy sản phẩm | WinMart";

    if (!product) {
      box.innerHTML = `<div class="empty-box"><h2>Không tìm thấy sản phẩm</h2><p>Sản phẩm này không tồn tại hoặc đã bị gỡ.</p><a class="btn-primary" href="index.html">Về trang chủ</a></div>`;
    } else {
      box.innerHTML = `
        <div class="detail-grid">
          <div class="detail-photo"><img src="${product.image}" alt="${product.name}" /></div>
          <div class="detail-info">
            <span class="detail-category">${product.category}</span>
            <h1>${product.name}</h1>
            <p class="detail-unit">${product.unit}</p>
            <div class="detail-price">
              <strong>${wmFormat(product.price)}</strong>
              <del>${wmFormat(product.oldPrice)}</del>
              <span class="detail-discount">-${product.discount}%</span>
            </div>
            <div class="qty-row">
              <span>Số lượng</span>
              <div class="stepper">
                <button id="minus" type="button">−</button>
                <span id="qty">1</span>
                <button id="plus" type="button">+</button>
              </div>
            </div>
            <button id="add" class="btn-primary btn-block" type="button">+ Thêm vào giỏ</button>
            <p id="msg" class="added-msg"></p>
          </div>
        </div>`;

      const qtyEl = document.getElementById("qty");
      document.getElementById("minus").onclick = () => { if (qty > 1) qtyEl.textContent = --qty; };
      document.getElementById("plus").onclick = () => { qtyEl.textContent = ++qty; };
      document.getElementById("add").onclick = () => {
        wmAddToCart(product.id, qty);
        document.getElementById("msg").textContent = `Đã thêm ${qty} sản phẩm vào giỏ hàng.`;
      };
    }
    wmUpdateCartBadge();
  </script>
</body>
</html>
